
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Submission History | CodeArena</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 40px;
            background: #0b1120;
            color: #e2e8f0;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 1100px;
            margin: auto;
        }
        h1 { color: #60a5fa; }
        .subtitle { color: #94a3b8; margin-bottom: 30px; }
        .table-wrap {
            overflow-x: auto;
            background: #111c32;
            border: 1px solid #263650;
            border-radius: 12px;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 16px 12px;
            border-bottom: 1px solid #263650;
        }
        th { color: #93c5fd; }
        td { color: #cbd5e1; }
        .status { font-weight: bold; }
        .empty {
            text-align: center;
            padding: 35px;
            color: #94a3b8;
        }
        a {
            display: inline-block;
            margin-top: 25px;
            color: white;
            background: #2563eb;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
        }
        a:hover { background: #1d4ed8; }
    </style>
</head>
<body>
<div class="container">

    <h1>Submission History</h1>
    <p class="subtitle">
        View your previous coding submissions and evaluation results.
    </p>

    <p th:if="${error}" th:text="${error}"></p>

    <div class="table-wrap">
        <table th:if="${submissions != null and !submissions.isEmpty()}">
            <thead>
            <tr>
                <th>ID</th>
                <th>Question</th>
                <th>Score</th>
                <th>Status</th>
                <th>Tests Passed</th>
                <th>Submitted At</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="s : ${submissions}">
                <td>
    <a th:href="@{/submissions/{id}(id=${s.submissionId})}"
       th:text="${s.submissionId}"></a>
</td>
                <td th:text="${questionTitles.get(s.questionId) != null
                    ? questionTitles.get(s.questionId)
                    : 'Question ' + s.questionId}"></td>
                <td th:text="${s.score}"></td>
                <td class="status" th:text="${s.status}"></td>
                <td>
                    <span th:text="${s.passedTests}"></span> /
                    <span th:text="${s.totalTests}"></span>
                </td>
                <td th:text="${s.submittedAt}"></td>
            </tr>
            </tbody>
        </table>

        <div class="empty"
             th:if="${submissions == null or submissions.isEmpty()}">
            You haven't submitted any solutions yet.
        </div>
    </div>

    <a href="/">Back to Dashboard</a>

</div>
</body>
</html>
